name: Daily Fanqie Rank Scraper

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-rank-writes-main
  cancel-in-progress: false

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 触发
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动在界面上点击 Run workflow

jobs:
  scrape-and-commit:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
        fetch-depth: 0

    - name: Sync Latest Main
      run: git pull --ff-only origin main

    - name: Check if today's data exists
      id: check_data
      run: |
        TODAY=$(date -u +"%Y%m%d")
        missing=0
        for FILE in \
          "data/fanqie_female_new_ranks_${TODAY}.json" \
          "data/fanqie_female_read_ranks_${TODAY}.json" \
          "data/fanqie_male_new_ranks_${TODAY}.json" \
          "data/fanqie_male_read_ranks_${TODAY}.json"; do
          if [ ! -f "$FILE" ]; then
            missing=1
            echo "📭 缺少今日快照: $FILE"
          fi
        done
        if [ "$missing" -eq 0 ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ 四个榜单今日快照均已存在，跳过爬取"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "📭 至少一个榜单缺少今日快照，将执行四榜补齐"
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ steps.check_data.outputs.exists }}" = "false" ]; then
          playwright install --with-deps chromium
        fi

    - name: Run Four Rank Scrapers
      if: steps.check_data.outputs.exists == 'false'
      run: |
        set -e
        python scrape_fanqie_ranks.py --channel 0 --type 1 --limit 30 --sleep 5
        python scrape_fanqie_ranks.py --channel 0 --type 2 --limit 30 --sleep 5
        python scrape_fanqie_ranks.py --channel 1 --type 1 --limit 30 --sleep 5
        python scrape_fanqie_ranks.py --channel 1 --type 2 --limit 30 --sleep 5
      env:
        GITHUB_ACTIONS: true

    - name: Update Stable Latest Entrances
      run: |
        TODAY=$(date -u +"%Y%m%d")
        cp "data/fanqie_female_new_ranks_${TODAY}.json" data/latest_female_new_ranks.json
        cp "data/fanqie_female_read_ranks_${TODAY}.json" data/latest_female_read_ranks.json
        cp "data/fanqie_male_new_ranks_${TODAY}.json" data/latest_male_new_ranks.json
        cp "data/fanqie_male_read_ranks_${TODAY}.json" data/latest_male_read_ranks.json

    - name: Build Latest Data with AI Summary
      run: |
        pip install openai
        python scripts/build_latest.py --channel 0 --type 1
        python scripts/build_latest.py --channel 0 --type 2
        python scripts/build_latest.py --channel 1 --type 1
        python scripts/build_latest.py --channel 1 --type 2
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Sync Latest Main Before Commit
      run: git pull --rebase --autostash origin main

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "[Auto] Update Fanqie daily ranks"
        file_pattern: data api
        branch: main

    # ---- Deploy to GitHub Pages (inline, 绕过 GITHUB_TOKEN 不触发其他 workflow 的限制) ----
    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
